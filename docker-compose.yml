services:
  api:
    build: .
    env_file: .env
    networks:
      default:
      web:
        aliases:
          - mood-diary-api
    environment:
      DATABASE_PATH: /data/mood.sqlite3
    volumes:
      - mood-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  bot:
    build: .
    command: ["python", "bot.py"]
    env_file: .env
    environment:
      DATABASE_PATH: /data/mood.sqlite3
    volumes:
      - mood-data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mood-data:

networks:
  web:
    external: true
