# Telegram Mini App (FastAPI + Next.js static export) at https://bot.koni.moscow
# nginx runs in Docker and reaches the API by its alias on the shared `web` network.

server {
    listen 80;
    server_name bot.koni.moscow;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name bot.koni.moscow;

    ssl_certificate /etc/letsencrypt/live/bot.koni.moscow/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.koni.moscow/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Docker DNS, resolved per request so nginx still starts while the API container is down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $mood_diary_api http://mood-diary-api:8000;

    # No X-Frame-Options: Telegram Web renders Mini Apps inside an iframe.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    client_max_body_size 1m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # FastAPI's interactive docs and schema are not needed in production.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        return 404;
    }

    # Content-hashed Next.js assets. add_header here replaces the server-level set.
    location ^~ /_next/static/ {
        proxy_read_timeout 60s;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        proxy_pass $mood_diary_api;
    }

    location ~ ^/api/doctor/patients/\d+/treatment-options$ {
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_pass $mood_diary_api;
    }

    # HTML pages (/hads/, /bdi/, …) and /api — FastAPI serves both.
    location / {
        proxy_read_timeout 60s;
        proxy_pass $mood_diary_api;
    }
}
